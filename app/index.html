<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the installed app paint under the status bar and
         the home indicator; src/index.css then pads the shell with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Both appearances are built from semantic tokens in src/index.css
         (dark-mode.md) and selected by the Light / Dark / System switcher
         (src/exam/theme.ts). This script applies the stored preference before
         first paint so there is no flash of the wrong theme. Keep it in sync
         with theme.ts: same key, same envelope shape, same 3px of logic. -->
    <meta name="color-scheme" content="light" />
    <meta name="description" content="IELTS Academic Writing practice: 60-minute computer/paper simulation." />
    <!-- Static pair: the pre-paint script below (and theme.ts applyTheme after it)
         resolves the appearance, rewrites both contents and drops `media`, so the
         status bar always matches the app, not just the OS. -->
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Install / standalone (PWA): manifest is relative to this document so the
         app installs correctly from any sub-path it is served at. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IELTS Writing" />
    <script>
      (function () {
        var stored = "system";
        try {
          var raw = window.localStorage.getItem("ielts.theme.v1");
          if (raw) {
            var parsed = JSON.parse(raw);
            /* Mirror store/persistence readStored: only a v1 envelope counts.
               A future schemaVersion is ignored before paint, so this script
               can never flash a theme the app is about to discard. */
            var value =
              parsed && typeof parsed === "object" && parsed.schemaVersion === 1 ? parsed.data : null;
            if (value === "light" || value === "dark" || value === "system") stored = value;
          }
        } catch (error) {
          /* storage blocked (private mode) or value unreadable: system wins */
        }
        var matchesDark = false;
        try {
          matchesDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (error) {
          /* matchMedia unavailable: light stays the fallback */
        }
        var resolved = stored === "system" ? (matchesDark ? "dark" : "light") : stored;
        var root = document.documentElement;
        root.classList.toggle("dark", resolved === "dark");
        root.style.colorScheme = resolved;
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute("content", resolved);
        /* Mirror theme.ts applyTheme exactly: collapse the static media pair into
           the single resolved color (media removed) so the browser chrome can
           never disagree with the appearance the app is about to paint. */
        var themeColor = resolved === "dark" ? "#000000" : "#F5F5F7";
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i += 1) {
          metas[i].removeAttribute("media");
          metas[i].setAttribute("content", themeColor);
        }
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230071E3'/%3E%3Cpath d='M9 23l4-1 9-9a2.5 2.5 0 0 0-3.5-3.5l-9 9-1 4z' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>IELTS Writing &mdash; CBT Simulation</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This application requires JavaScript to run the exam timer and editor.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
